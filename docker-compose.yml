services:
  mongodb:
    image: mongo
    container_name: dart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dart_tracker
    networks:
      - dart-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: dart-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/dart_tracker
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      HOST_IP: ${HOST_IP:-}
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
    depends_on:
      - mongodb
    networks:
      - dart-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: dart-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://dart-backend:3000
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - backend
    networks:
      - dart-network

volumes:
  mongodb_data:

networks:
  dart-network:
    driver: bridge
